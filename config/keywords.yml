version: 1

arxiv:
  api_url: https://export.arxiv.org/api/query
  max_results: 75
  lookback_days: 8
  query_batch_size: 6
  query_terms:
    - 2D materials
    - two-dimensional materials
    - graphene
    - transition metal dichalcogenide
    - TMD
    - MoS2
    - WS2
    - WSe2
    - MoSe2
    - MoTe2
    - van der Waals heterostructure
    - vdW heterostructure
    - twisted heterostructure
    - black phosphorus
    - phosphorene
    - hexagonal boron nitride
    - hBN
    - MXene
    - moire material

crossref:
  enabled: true
  api_url: https://api.crossref.org/works
  max_results_per_query: 20
  lookback_days: 8
  query_terms:
    - graphene quantum transport
    - two-dimensional superconductivity
    - two-dimensional topological materials
    - van der Waals quantum materials
    - moire correlated electrons
    - two-dimensional magnetism
    - TMD excitons
    - spin valley two-dimensional materials

semantic_scholar:
  enabled: true
  api_url: https://api.semanticscholar.org/graph/v1
  batch_size: 100

