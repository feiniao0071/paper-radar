name: Temporary encrypted agent key transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt existing model key for the local agent
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${LLM_API_KEY:-}"
          umask 077
          cat > recipient.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAoQbfAoSF1Z9ZuO2hqHep
          vPyDEnf7B85SgKkJnZN9yMeDH/O30ZaE4LZDald/R6xaU+/QNiSPzGPAWF7R1T4f
          w702L5rSL5atdYhAYYoZqpGDsZGALRBsYHR1OxNqUbcPSkfSrKllkSrSgU8oXUnY
          XCQk0KfLhPxuQo5jQ88UvPXFpzj9QM9Ornct3K2w2I/fDtomkvpH9iFfo8/kNUxP
          fSuqf6oTd84oX7PtUi0baIH0Pn3+htKd5KpBTQDfVZKA+hRXR+cMpH3/KZ3P3LYK
          4OfQvZRA1mu8g5rfvM8mCV3+sWmdo477Wnu6StTe0ojGrasmVQ6x+WUle+sJJB8v
          TCejlb/tO+3rIIY4aNDDCNw8nJBSTB/p15EWsfoPHESTFxY0n5HZpuJcRPj6LWSr
          U5iXB3eY7nkYDSXfFBo/yJ5sOuA7/fjy/HWQZgN/bRwbIQqoqz0+55OeiMTcQ0Sj
          EM2HsP7P+8dvzG0okuYTpPEWKiPRuo0WoLMfEAmHINsZuM+IF2hSVGfVKh04PeLB
          wEWfAsGD+4W2PMHnL7nuBGIXUvTVkJboZ0pURz7OJhH+MVruMg3ZbBsez7lUK1RQ
          J5jbIzCefA5q8pSIbwwy9pJNFGUYWqawWDUhi/4qDESlul+LCBnlmNX6twuTXlhq
          PwltlYqlDx8ALNhRoDJAQRUCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$LLM_API_KEY" | openssl pkeyutl \
            -encrypt \
            -pubin \
            -inkey recipient.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out encrypted-key.bin
          unset LLM_API_KEY
          test "$(wc -c < encrypted-key.bin)" -eq 512

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: lhf-agent-key-c31bebab
          path: encrypted-key.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
