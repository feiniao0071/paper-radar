name: Quantum AI Materials Radar

on:
  schedule:
    # Staggered after the 2D radar. This is 18:33 in Beijing (UTC+8).
    - cron: "33 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview results without sending or updating state"
        required: true
        type: boolean
        default: true
      no_ai:
        description: "Skip optional Responses API evaluation"
        required: true
        type: boolean
        default: false
      resend_latest:
        description: "Resend the latest digest, ignoring deduplication"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-radar-state
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.QUANTUM_AI_FEISHU_WEBHOOK_URL }}
      FEISHU_SIGNING_SECRET: ${{ secrets.QUANTUM_AI_FEISHU_SIGNING_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.6-sol' }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
      ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
    steps:
      # Scheduled/queued runs must start from the latest state commit, not the
      # event SHA captured before another radar run updates the branch.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Run Quantum AI Materials radar
        id: radar
        continue-on-error: true
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_NO_AI: ${{ inputs.no_ai }}
          MANUAL_RESEND_LATEST: ${{ inputs.resend_latest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --config config/quantum_ai_keywords.yml
            --prompt config/quantum_ai_recommender_prompt.txt
            --state state/quantum_ai_seen.json
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NO_AI" == "true" ]]; then
            args+=(--no-ai)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_RESEND_LATEST" == "true" ]]; then
            args+=(--resend-latest)
          fi
          python -m paper_radar "${args[@]}"
      - name: Commit Quantum AI deduplication state
        if: always()
        run: |
          if git diff --quiet -- state/quantum_ai_seen.json; then
            exit 0
          fi
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add state/quantum_ai_seen.json
          git commit -m "chore: update Quantum AI radar state"
          git pull --rebase origin main
          git push
      - name: Propagate radar failure
        if: steps.radar.outcome == 'failure'
        run: exit 1
